name: Build Windows app
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run desktop:package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Test the bundled desktop app offline
        shell: pwsh
        run: |
          $env:SAA_PACKAGED_EXECUTABLE = (Resolve-Path 'release/win-unpacked/AWS SAA Study Studio.exe').Path
          npm run test:desktop
      - name: Write checksums
        shell: pwsh
        run: |
          Get-ChildItem release -Filter *.exe | ForEach-Object { "$((Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-app
          path: |
            release/*.exe
            release/SHA256SUMS.txt
      - name: Publish downloadable GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @'
          Download the Windows x64 Setup executable to install AWS SAA Study Studio, or the Portable executable to run it without installation. Both include the runtime, all 650 paper questions, the study course, and local progress storage. No Node.js, Docker, login server, OTP, or internet is required to study.

          Local email-and-password profiles are unique per installation, not shared globally. Email ownership is not verified. Export progress before moving devices or clearing app data. Windows installers are unsigned; Windows may show a publisher/SmartScreen warning. Only download these files from this repository's Releases page. SHA256SUMS.txt records build checksums.
          '@
          $notes | Set-Content release/RELEASE-NOTES.md
          $assets = Get-ChildItem release -Filter *.exe | ForEach-Object { $_.FullName }
          gh release create "$env:GITHUB_REF_NAME" @assets release/SHA256SUMS.txt --title "AWS SAA Study Studio $env:GITHUB_REF_NAME" --notes-file release/RELEASE-NOTES.md
